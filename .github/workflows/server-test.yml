name: Sniper Arena server test

on:
  push:
    paths:
      - 'hud_mod/**'
      - 'datapacks/**'
      - 'test/server/**'
      - '.github/workflows/server-test.yml'
  workflow_dispatch:

jobs:
  server-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VIEW_DISTANCE: '12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'
      - name: Build the mod
        working-directory: hud_mod
        run: gradle build --no-daemon
      - name: Install Forge 1.20.1 server
        run: |
          mkdir -p "$RUNNER_TEMP/server"
          cd "$RUNNER_TEMP/server"
          curl -fsSL -o installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.2.0/forge-1.20.1-47.2.0-installer.jar
          java -jar installer.jar --installServer . > install.log 2>&1 || (tail -50 install.log; exit 1)
          touch user_jvm_args.txt
      - name: Prepare world, datapack and mod
        run: |
          S="$RUNNER_TEMP/server"
          cd "$S"
          echo "eula=true" > eula.txt
          cat > server.properties <<EOF
          online-mode=false
          enable-rcon=true
          rcon.password=test
          rcon.port=25575
          server-port=25565
          level-name=world
          view-distance=${VIEW_DISTANCE}
          simulation-distance=8
          spawn-protection=0
          max-players=10
          enforce-secure-profile=false
          network-compression-threshold=256
          allow-flight=true
          sync-chunk-writes=false
          EOF
          sed -i 's/^ *//' server.properties
          mkdir -p world mods
          for d in level.dat region entities poi data datapacks serverconfig DIM-1 DIM1; do
            cp -r "$GITHUB_WORKSPACE/$d" world/ 2>/dev/null || true
          done
          # CI server has no TaCZ / LR Tactical: use vanilla stand-in items with the same NBT
          find world/datapacks/sniper_arena -name '*.mcfunction' -print0 | xargs -0 sed -i \
            -e 's/tacz:modern_kinetic_gun/minecraft:crossbow/g' -e 's/lrtactical:melee/minecraft:iron_sword/g'
          # helper functions for same-tick hits
          T=world/datapacks/satest
          mkdir -p "$T/data/satest/functions"
          echo '{"pack":{"pack_format":15,"description":"Sniper Arena CI helpers"}}' > "$T/pack.mcmeta"
          printf '%s\n' 'damage Host2 1000 minecraft:player_attack by Host1' 'damage Host2 1000 minecraft:player_attack by Guest' > "$T/data/satest/functions/double_hit.mcfunction"
          printf '%s\n' 'damage Guest 1000 minecraft:player_attack by Host1' 'damage Host1 1000 minecraft:player_attack by Guest' > "$T/data/satest/functions/trade.mcfunction"
          cp "$GITHUB_WORKSPACE"/hud_mod/build/libs/*.jar mods/
          ls mods
      - name: Run the test
        run: python3 test/server/run_test.py "$RUNNER_TEMP/server" "$VIEW_DISTANCE"
      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            ${{ runner.temp }}/server/console.log
            ${{ runner.temp }}/server/logs/
          if-no-files-found: ignore
